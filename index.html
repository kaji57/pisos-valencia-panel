<script>
const payload = JSON.parse(document.getElementById('payload').textContent);
const form = document.getElementById('gate');
const pin = document.getElementById('pin');
const err = document.getElementById('err');
const btn = document.getElementById('go');
const bytes = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

async function unlock(value) {
  const material = await crypto.subtle.importKey('raw', new TextEncoder().encode(value), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: bytes(payload.salt), iterations: payload.iterations, hash: 'SHA-256' },
    material, { name: 'AES-GCM', length: 256 }, false, ['decrypt'],
  );
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(payload.iv) }, key, bytes(payload.data));
  return new TextDecoder().decode(plain);
}

function show(html) {
  // innerHTML is safe here by construction, not by luck: AES-GCM is
  // authenticated, so decrypt() only returns when the ciphertext and tag are
  // exactly what we produced. Nobody can substitute markup without the key.
  document.body.innerHTML = html;
  document.body.removeAttribute('style');
  // Scripts injected as markup never run; re-create them so the sorting,
  // filtering and chart come alive. Document order is preserved, so the JSON
  // islands are in place before the code that reads them.
  for (const old of [...document.body.querySelectorAll('script')]) {
    const s = document.createElement('script');
    if (old.id) s.id = old.id;
    if (old.type) s.type = old.type;
    s.textContent = old.textContent;
    old.replaceWith(s);
  }
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  err.textContent = '';
  btn.disabled = true;
  btn.textContent = 'Abriendo…';
  try {
    const html = await unlock(pin.value.trim());
    try { sessionStorage.setItem('pin', pin.value.trim()); } catch {}
    show(html);
  } catch {
    err.textContent = 'PIN incorrecto.';
    btn.disabled = false;
    btn.textContent = 'Entrar';
    pin.select();
  }
});

// Re-entering within the session should not mean re-typing it.
(async () => {
  let saved = null;
  try { saved = sessionStorage.getItem('pin'); } catch {}
  if (!saved) return;
  try { show(await unlock(saved)); } catch { try { sessionStorage.removeItem('pin'); } catch {} }
})();
</script>
